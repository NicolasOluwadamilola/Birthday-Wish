
<!DOCTYPE html>
<html>
<head>
  <title>I'm Sorry 💔</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div id="startScreen" style="
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.7);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:2em;
  cursor:pointer;
  z-index:1000;
  text-align: center;
  padding: 20px;
  box-sizing: border-box;
  flex-direction: column;
  line-height: 1.5;
">
  <span style="font-family: 'Great Vibes', cursive; font-size: 3rem;">💔</span>
  <span>Tap anywhere to begin</span>
</div>
  <!-- 🎀 Ribbons (now representing falling tears) -->
  <div class="ribbons"></div>

  <!-- 🌸 Music Player (hidden controls) -->
  <audio id="bgMusic" loop autoplay></audio>

  <!-- SPA Container -->
  <div class="page-container">
    <!-- Page content will be injected here -->
  </div>

  <script src="script.js"></script>
</body>
</html>
